# persona = prompt + allowed tools + proactive permissions
id: secretary
name: Secretary
is_enabled: true
telegram_token_env: TELEGRAM_TOKEN_SECRETARY
prompt_files:
  - prompts/rules.md
  - prompts/secretary.md
tools:
  - reminders.create
  - reminders.list
  - tasks.list
  # - expenses.*        # belongs to the Finance bot; the Secretary calls it via ask_specialist
  # - calendar.*        # phase 4
  # - email.*           # phase 4 (before the Email bot is split out)
  # - ask_specialist    # phase 5b — only the Secretary may have this tool
proactive:
  morning_brief: false  # turned on in phase 5
memory:
  history: own          # this persona's own chat history
  facts: shared
