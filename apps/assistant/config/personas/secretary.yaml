# persona = prompt + allowed tools + proactive permissions
id: secretary
name: Secretary
is_enabled: true
telegram_token_env: TELEGRAM_TOKEN_SECRETARY
prompt_files:
  - prompts/rules.md
  - prompts/secretary.md
tools:
  # ADR-32: the Secretary holds no domain tools; it only routes
  - ask_specialist      # only the Secretary may have this tool
proactive: {}          # nothing on a schedule; each specialist sends its own report (ADR-39)
memory:
  history: own          # this persona's own chat history
  facts: shared
