name: Checks

on:
  pull_request:  # run on every PR
  push:
    branches: [main]  # and after merging into main

jobs:
  # .NET apps and services: one job per solution (ADR-33); later: run only what a PR changes
  dotnet:
    runs-on: ubuntu-latest  # a fresh Linux machine from GitHub

    strategy:
      fail-fast: false  # finish every solution, so one PR shows all failures
      matrix:
        solution: [apps/assistant/Assistant.slnx]
    name: dotnet (${{ matrix.solution }})

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install the .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore ${{ matrix.solution }}

      - name: Check formatting and style (.editorconfig)
        run: dotnet format ${{ matrix.solution }} --verify-no-changes --no-restore

      - name: Build (warnings are errors, Directory.Build.props)
        run: dotnet build ${{ matrix.solution }} --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ${{ matrix.solution }} --no-build --configuration Release

  # Python services: only market (ADR-33)
  python:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        path: [services/market]
    name: python (${{ matrix.path }})

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the service and dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check import rules
        run: lint-imports

      - name: Run tests
        # exit code 5 = no tests collected yet; any other failure still fails
        run: pytest || [ $? -eq 5 ]

  # "checks" is the required check on main (ADR-18): green only if every job above is green
  checks:
    runs-on: ubuntu-latest
    needs: [dotnet, python]
    if: always()  # still runs when a job fails, so the result is reported
    steps:
      - name: All apps and services passed
        run: test "${{ needs.dotnet.result }}" = "success" && test "${{ needs.python.result }}" = "success"
