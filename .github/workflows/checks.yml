name: Checks

on:
  pull_request:  # run on every PR
  push:
    branches: [main]  # and after merging into main

jobs:
  checks:
    runs-on: ubuntu-latest  # a fresh Linux machine from GitHub

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the project and dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check import layers
        run: lint-imports

      - name: Run tests
        run: pytest
