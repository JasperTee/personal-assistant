name: Checks

on:
  pull_request:  # run on every PR
  push:
    branches: [main]  # and after merging into main

jobs:
  # one job per service (ADR-26); later: run only the services a PR changes (paths filters)
  service:
    runs-on: ubuntu-latest  # a fresh Linux machine from GitHub

    strategy:
      fail-fast: false  # finish every service, so one PR shows all failures
      matrix:
        service: [assistant, rental, market, finance]
    name: service (${{ matrix.service }})

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the service and dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check import rules
        run: lint-imports

      - name: Run tests
        # exit code 5 = no tests collected yet (stub services); any other failure still fails
        run: pytest || [ $? -eq 5 ]

  # "checks" is the required check on main (ADR-18): green only if every service job is green
  checks:
    runs-on: ubuntu-latest
    needs: service
    if: always()  # still runs when a service job fails, so the result is reported
    steps:
      - name: All services passed
        run: test "${{ needs.service.result }}" = "success"
