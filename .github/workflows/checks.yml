name: Checks

on:
  pull_request:  # run on every PR
  push:
    branches: [main]  # and after merging into main

jobs:
  # one job per app and service (ADR-26, ADR-30); later: run only what a PR changes (paths filters)
  check:
    runs-on: ubuntu-latest  # a fresh Linux machine from GitHub

    strategy:
      fail-fast: false  # finish every service, so one PR shows all failures
      matrix:
        path: [apps/assistant, services/rental, services/market, services/finance]
    name: check (${{ matrix.path }})

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the service and dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check import rules
        run: lint-imports

      - name: Run tests
        # exit code 5 = no tests collected yet (stub services); any other failure still fails
        run: pytest || [ $? -eq 5 ]

  # "checks" is the required check on main (ADR-18): green only if every app and service job is green
  checks:
    runs-on: ubuntu-latest
    needs: check
    if: always()  # still runs when a service job fails, so the result is reported
    steps:
      - name: All apps and services passed
        run: test "${{ needs.check.result }}" = "success"
