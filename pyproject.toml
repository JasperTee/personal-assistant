[project]
name = "personal-assistant"
version = "0.1.0"
description = "Personal AI assistant over Telegram — Secretary + specialist bots"
requires-python = ">=3.12"
# added phase by phase (see the Libraries table in the design document).
dependencies = [
    "pydantic>=2",            # phase 1 — data contracts
    "python-telegram-bot>=21",# phase 1 — Telegram adapter
    "sqlalchemy>=2",          # phase 1 — repository
    "alembic",                # phase 1 — migrations
    "python-dotenv",          # phase 1 — read .env
    "pyyaml",                 # phase 1 — read config/
    # "anthropic",            # phase 2
    # "apscheduler",          # phase 5
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "import-linter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/ and has no __init__.py files; importlib mode lets two test files
# share a name in different folders (e.g. tests/x/test_models.py and tests/y/test_models.py).
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E: style, F: bugs, I: import order, N: naming (PEP 8); see docs/conventions.md.
# no "W" (whitespace) rules: `ruff format` on save already fixes whitespace.
select = ["E", "F", "I", "N", "D403"]  # D403: docstrings start with a capital letter

# dependency rule (ADR-16), checked by `lint-imports`.
# a layer may import the layers below it, never the ones above.
# "|" means the two sides are independent: they must not import each other.
[tool.importlinter]
root_package = "assistant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "assistant.main",
    "assistant.channels | assistant.infrastructure",
    "assistant.orchestration",
    "assistant.policy | assistant.tools",
    "assistant.domain",
]

[[tool.importlinter.contracts]]
name = "Inner layers do not know frameworks"
type = "forbidden"
source_modules = [
    "assistant.domain",
    "assistant.policy",
    "assistant.tools",
    "assistant.orchestration",
]
forbidden_modules = ["telegram", "sqlalchemy", "alembic", "yaml", "dotenv"]
