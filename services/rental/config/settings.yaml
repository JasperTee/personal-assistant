# rental service settings — no secrets here (secrets live in .env)

retention:                   # ADR-27; run by a scheduled job in plain code, never by the LLM
  details_months: 12         # invoices, confirmed readings, detailed calculation results
  meter_photos_months: 3     # meter-book photos; the confirmed readings are the record

invoices:
  dir: data/invoices         # data/invoices/2026-11/block-a/room-05.pdf
  formats: [pdf, png]

meter_photos:
  dir: data/meter_photos
