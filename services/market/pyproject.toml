[project]
name = "market"
version = "0.1.0"
description = "Market service: market data, graded evidence, forecasts and their scores (ADR-25)"
requires-python = ">=3.12"
# added step by step, like services/assistant.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "import-linter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/ and has no __init__.py files (same as services/assistant).
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# same rules as services/assistant; see docs/conventions.md.
select = ["E", "F", "I", "N", "D403"]

# only domain/ exists so far; the layers contract is added with application/ (ADR-26).
[tool.importlinter]
root_package = "market"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Market domain is pure: no frameworks, no other service"
type = "forbidden"
source_modules = ["market.domain"]
forbidden_modules = ["assistant", "rental", "finance", "sqlalchemy", "grpc"]
